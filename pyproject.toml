[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indispoof"
version = "0.0.1"
description = "IndiSpoof: a cross-lingual benchmark for audio deepfake detection in Indic languages"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Phase 1 ingestion: audio info, parquet shards, Hugging Face download, figures.
data = ["soundfile>=0.12", "pyarrow>=14", "huggingface_hub>=0.23", "matplotlib>=3.7"]
# Needed from Phase 3 onwards.
audio = ["soundfile>=0.12", "torch>=2.1", "torchaudio>=2.1"]

[project.scripts]
indispoof = "indispoof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
